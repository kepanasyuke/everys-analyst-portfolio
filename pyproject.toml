[project]
name = "everys-analyst-portfolio"
version = "1.0.0"
description = "Портфолио системного/продуктового аналитика Everys WinPharma: 8 AI-native инструментов"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.110", "uvicorn>=0.27", "pydantic>=2.5"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["app", "projects", "tests", "tools"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RET", "PL", "C4", "PTH"]
ignore = ["PLR2004"]

[tool.ruff.lint.pylint]
max-returns = 1
max-statements = 2

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]
