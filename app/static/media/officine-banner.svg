<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="bannerTitle">
  <title id="bannerTitle">officine — рабочее место аптеки на Everys WinPharma</title>
  <defs>
    <linearGradient id="bannerBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.62" stop-color="#fdfaff" />
      <stop offset="1" stop-color="#f4e6f9" />
    </linearGradient>
    <radialGradient id="bannerViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9e12c9" stop-opacity="0.35" />
      <stop offset="1" stop-color="#9e12c9" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="bannerGreen" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4bd411" stop-opacity="0.3" />
      <stop offset="1" stop-color="#4bd411" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="bannerTile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b32ee0" />
      <stop offset="1" stop-color="#7a0e9b" />
    </linearGradient>
    <pattern id="bannerGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ecdcf5" stroke-width="1" />
    </pattern>
    <pattern id="bannerDots" width="15" height="15" patternUnits="userSpaceOnUse">
      <circle cx="1.3" cy="1.3" r="1.3" fill="#d3b8e3" opacity="0.65" />
    </pattern>
  </defs>

  <rect width="1200" height="420" fill="url(#bannerBase)" />
  <rect width="1200" height="420" fill="url(#bannerGrid)" opacity="0.5" />
  <ellipse cx="1010" cy="70" rx="300" ry="230" fill="url(#bannerViolet)" />
  <ellipse cx="120" cy="400" rx="260" ry="180" fill="url(#bannerGreen)" />
  <rect x="44" y="44" width="240" height="140" fill="url(#bannerDots)" opacity="0.55" />
  <g fill="none" stroke="#e4d4ef" stroke-width="1.2" opacity="0.75">
    <path d="M-30 392 236 126" />
    <path d="M120 452 396 176" />
  </g>
  <rect x="0" y="0" width="1200" height="6" fill="#9e12c9" />

  <g>
    <rect x="52" y="60" width="64" height="64" rx="16" fill="url(#bannerTile)" />
    <rect x="68" y="76" width="10" height="32" rx="3" fill="#ffffff" opacity="0.95" />
    <rect x="81" y="76" width="10" height="32" rx="3" fill="#4bd411" />
    <circle cx="105" cy="78" r="4.5" fill="#4bd411" stroke="#7a0e9b" stroke-width="1.5" />

    <text x="132" y="98" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="38" font-weight="600" fill="#000000">officine</text>
    <text x="132" y="122" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14" letter-spacing="1.2" fill="#8a8a8a">EVERYS · WINPHARMA · ПОРТФОЛИО 2026</text>

    <text x="52" y="186" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#000000">Рабочее место аптеки: продажи,</text>
    <text x="52" y="218" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="25" font-weight="500" fill="#000000">возвраты и пополнение в одной системе</text>
    <text x="52" y="250" font-family="Roboto, Arial, Helvetica, sans-serif" font-size="15" fill="#3d3d3d">Python · FastAPI · SQLite · модульный фронтенд без сборки</text>

    <g font-family="Roboto, Arial, Helvetica, sans-serif" font-size="14">
      <rect x="52" y="274" width="118" height="36" rx="18" fill="#ffffff" stroke="#e2d2ee" />
      <circle cx="72" cy="292" r="4.5" fill="#9e12c9" />
      <text x="84" y="297" fill="#3d3d3d">7 экранов</text>

      <rect x="182" y="274" width="104" height="36" rx="18" fill="#ffffff" stroke="#e2d2ee" />
      <circle cx="202" cy="292" r="4.5" fill="#9e12c9" />
      <text x="214" y="297" fill="#3d3d3d">12 аптек</text>

      <rect x="298" y="274" width="136" height="36" rx="18" fill="#ffffff" stroke="#e2d2ee" />
      <circle cx="318" cy="292" r="4.5" fill="#4bd411" />
      <text x="330" y="297" fill="#3d3d3d">1400 продаж</text>

      <rect x="52" y="322" width="150" height="36" rx="18" fill="#ffffff" stroke="#e2d2ee" />
      <circle cx="72" cy="340" r="4.5" fill="#4bd411" />
      <text x="84" y="345" fill="#3d3d3d">167 проверок</text>

      <rect x="214" y="322" width="170" height="36" rx="18" fill="#f4e6f9" />
      <circle cx="234" cy="340" r="4.5" fill="#4bd411" />
      <text x="246" y="345" fill="#7a0e9b" font-weight="500">reporting / live demo</text>
    </g>
  </g>

  <image href="/static/media/officine-shot.svg" x="470" y="34" width="700" height="428" preserveAspectRatio="xMidYMid meet" />
</svg>
